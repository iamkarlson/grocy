            - "shopping_list"
            - "shopping_lists"
            - "shopping_locations"
            - "recipes"
            - "recipes_pos"
            - "recipes_nestings"
            - "tasks"
            - "task_categories"
            - "product_groups"
            - "equipment"
            - "userfields"
            - "userentities"
            - "userobjects"
            - "meal_plan"

    object_id:
      name: Object ID
      description: The ID of the entity to delete.
      required: true
